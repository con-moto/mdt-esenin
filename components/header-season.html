<header class="site-header">
  <div class="logo-header">
    <a
      class="logo-header__link"
      href="#"
      aria-label="На главную"
      data-root-path="index.html"
    >
      <img
        class="logo-header__image"
        src=""
        alt="МДТ имени Сергея Есенина"
        data-root-path="assets/images/main-logo.avif"
        data-root-attribute="src"
      >
    </a>
  </div>

  <div class="season-header">
    <h1 class="season-header__title">X театральный сезон</h1>
  </div>

  <div class="red-header">
    <div class="red-header__container">
      <ul class="socials" aria-label="Социальные сети театра">
        <li>
          <a
            href="https://vk.com/mdtesenina"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="ВКонтакте"
          >
            <img
              src=""
              alt=""
              data-root-path="assets/icons/vk.avif"
              data-root-attribute="src"
            >
          </a>
        </li>

        <li>
          <a
            href="https://t.me/mdtesenina"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram"
          >
            <img
              src=""
              alt=""
              data-root-path="assets/icons/telegram.avif"
              data-root-attribute="src"
            >
          </a>
        </li>
      </ul>

      <button
        class="menu-toggle"
        type="button"
        aria-label="Открыть меню"
        aria-expanded="false"
        aria-controls="mobile-navigation"
      >
        <span class="menu-toggle__line"></span>
        <span class="menu-toggle__line"></span>
        <span class="menu-toggle__line"></span>
      </button>

      <div id="common-navigation"></div>
    </div>
  </div>
</header>
