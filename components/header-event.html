<header class="event-header">
  <section
    class="event-hero"
    aria-labelledby="event-hero-title"
    data-event-hero
  >
    <div
      class="event-hero__slides"
      aria-hidden="true"
      data-event-slides
    ></div>

    <div class="event-hero__content">
      <div class="event-hero__copy">
        <p class="event-hero__genre" data-event-genre></p>

        <h1
          class="event-hero__title"
          id="event-hero-title"
          data-event-title
        ></h1>

        <a
          class="event-hero__ticket-button"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          data-event-ticket
        >
          Купить билеты
        </a>
      </div>

      <div
        class="event-hero__socials"
        aria-label="Социальные сети театра"
      >
        <a
          class="event-hero__social"
          href="https://vk.com/mdtesenina"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="ВКонтакте"
        >
          <img
            src=""
            alt=""
            data-root-path="assets/icons/vk-white.png"
            data-root-attribute="src"
          >
        </a>

        <a
          class="event-hero__social"
          href="https://t.me/mdtesenina"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Telegram"
        >
          <img
            src=""
            alt=""
            data-root-path="assets/icons/tg-white.png"
            data-root-attribute="src"
          >
        </a>
      </div>

      <button
        class="menu-toggle event-hero__menu-toggle"
        type="button"
        aria-label="Открыть меню"
        aria-expanded="false"
        aria-controls="mobile-navigation"
      >
        <span class="menu-toggle__line"></span>
        <span class="menu-toggle__line"></span>
        <span class="menu-toggle__line"></span>
      </button>

      <blockquote
        class="event-hero__quote"
        data-event-quote
      >
        <span class="event-hero__quote-inner"></span>
      </blockquote>
    </div>
    
    <a
      class="event-hero__logo"
      href="#"
      data-root-path="index.html"
      aria-label="На главную"
    >
      <img
        src=""
        alt="Логотип театра"
        data-root-path="assets/images/main-logo.png"
        data-root-attribute="src"
      >
    </a>
  </section>

  <div class="event-header__spacer"></div>
  <div id="common-navigation"></div>
</header>
