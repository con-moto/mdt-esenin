<header class="site-header site-header--club">
  <div class="club-header__logo-row">
    <ul
      class="club-header__socials"
      aria-label="Социальные сети театра"
    >
      <li>
        <a
          href="https://vk.com/mdtesenina"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="ВКонтакте"
        >
          <img
            src=""
            alt=""
            data-root-path="assets/icons/vk.png"
            data-root-attribute="src"
          >
        </a>
      </li>

      <li>
        <a
          href="https://t.me/mdtesenina"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Telegram"
        >
          <img
            src=""
            alt=""
            data-root-path="assets/icons/telegram.png"
            data-root-attribute="src"
          >
        </a>
      </li>
    </ul>

    <a
      class="club-header__logo-link"
      href="#"
      aria-label="На главную"
      data-root-path="index.html"
    >
      <img
        class="club-header__logo"
        src=""
        alt="МДТ имени Сергея Есенина"
        data-root-path="assets/images/main-logo.avif"
        data-root-attribute="src"
      >
    </a>

    <button
      class="club-header__menu-toggle menu-toggle"
      type="button"
      aria-label="Открыть меню"
      aria-expanded="false"
      aria-controls="mobile-navigation"
    >
      <span class="menu-toggle__line"></span>
      <span class="menu-toggle__line"></span>
      <span class="menu-toggle__line"></span>
    </button>
  </div>
</header>
