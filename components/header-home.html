<header class="site-header site-header--home">
  <div class="site-header__container">
    <a
      class="site-header__director"
      href="#"
      data-root-path="people/management/yaroslav-shevaldov.html"
    >
      Художественный руководитель — Ярослав Шевалдов
    </a>

    <div class="site-header__main-row">
      <div class="site-header__left-column">
        <a
          class="site-header__button"
          href="#"
          data-root-path="afisha.html"
        >
          Купить билеты
        </a>
      </div>

      <a
        class="site-header__logo-link"
        href="#"
        aria-label="На главную"
        data-root-path="index.html"
      >
        <img
          class="site-header__logo"
          src=""
          alt="МДТ имени Сергея Есенина"
          data-root-path="assets/images/main-logo.avif"
          data-root-attribute="src"
        >
      </a>

      <div class="site-header__right-column">
        <div class="site-header__right-group">
          <div class="site-header__socials">
            <a
              class="site-header__social"
              href="https://vk.com/mdtesenina"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="ВКонтакте"
            >
              <img
                src=""
                alt=""
                data-root-path="assets/icons/vk.avif"
                data-root-attribute="src"
              >
            </a>

            <a
              class="site-header__social"
              href="https://t.me/mdtesenina"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Telegram"
            >
              <img
                src=""
                alt=""
                data-root-path="assets/icons/telegram.avif"
                data-root-attribute="src"
              >
            </a>
          </div>

          <a
            class="site-header__button"
            href="#"
            data-root-path="index.html#contacts"
          >
            Связаться с нами
          </a>

          <button
            class="menu-toggle"
            type="button"
            aria-label="Открыть меню"
            aria-expanded="false"
            aria-controls="mobile-navigation"
          >
            <span class="menu-toggle__line"></span>
            <span class="menu-toggle__line"></span>
            <span class="menu-toggle__line"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="site-header__divider"></div>
  </div>

  <div id="common-navigation"></div>
</header>
