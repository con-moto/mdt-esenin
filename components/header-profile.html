<header class="site-header site-header--profile">
  <div class="profile-topbar">
    <div class="profile-topbar__inner">
      <p class="profile-topbar__label profile-topbar__label--left">
        ОТКРЫТИЕ СЕЗОНА
      </p>

      <a
        class="profile-topbar__logo-link"
        href="#"
        aria-label="На главную"
        data-root-path="index.html"
      >
        <img
          class="profile-topbar__logo"
          src=""
          alt="МДТ имени Сергея Есенина"
          data-root-path="assets/images/main-logo.avif"
          data-root-attribute="src"
        >
      </a>

      <p class="profile-topbar__label profile-topbar__label--right">
        СЕНТЯБРЬ 2026
      </p>
    </div>
  </div>

  <div class="red-header">
    <div class="red-header__container">
      <ul class="socials" aria-label="Социальные сети театра">
        <li>
          <a
            href="https://vk.com/mdtesenina"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="ВКонтакте"
          >
            <img
              src=""
              alt=""
              data-root-path="assets/icons/vk.png"
              data-root-attribute="src"
            >
          </a>
        </li>

        <li>
          <a
            href="https://t.me/mdtesenina"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram"
          >
            <img
              src=""
              alt=""
              data-root-path="assets/icons/telegram.png"
              data-root-attribute="src"
            >
          </a>
        </li>
      </ul>

      <button
        class="menu-toggle"
        type="button"
        aria-label="Открыть меню"
        aria-expanded="false"
        aria-controls="mobile-navigation"
      >
        <span class="menu-toggle__line"></span>
        <span class="menu-toggle__line"></span>
        <span class="menu-toggle__line"></span>
      </button>

      <div id="common-navigation"></div>
    </div>
  </div>
</header>
