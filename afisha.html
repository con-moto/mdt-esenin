<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>Афиша — МДТ имени Сергея Есенина</title>


  <link
    rel="icon"
    type="image/avif"
    href="./assets/images/main-logo.avif"
  >


  <link rel="stylesheet" href="./styles/reset.css">
  <link rel="stylesheet" href="./styles/root.css">
  <link rel="stylesheet" href="./styles/header-season.css">
  <link rel="stylesheet" href="./styles/navigation.css">
  <link rel="stylesheet" href="./styles/footer.css">
  <link rel="stylesheet" href="./styles/afisha-month.css">
  <link rel="stylesheet" href="./styles/afisha-cards.css">
</head>


<body data-root="./" data-header="header-season" data-page="afisha">
  <div id="common-header"></div>


  <main class="posters">
    <div class="posters__line"></div>


    <section class="month">
      <h2 class="month__title">Сентябрь</h2>
    </section>


    <div class="posters__line"></div>


    <section class="events" aria-label="Спектакли сентября">
      <div class="events__list" id="events-list"></div>
    </section>


    <div class="posters__line"></div>


    <section class="month">
      <h2 class="month__title">Октябрь</h2>
    </section>


    <div class="posters__line"></div>


    <section class="events" aria-label="Спектакли октября">
      <div class="events__list" id="events-list-october"></div>
    </section>


    <div class="posters__line"></div>


    <section class="events" aria-label="Билет с открытой датой">
      <div class="events__list" id="events-list-open-date"></div>
    </section>
  </main>


  <div id="common-footer"></div>
  <script src="./scripts/layout.js" defer></script>
  <script src="./scripts/afisha.js" defer></script>
</body>
</html>
