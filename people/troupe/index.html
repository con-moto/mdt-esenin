<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Труппа — МДТ имени Сергея Есенина</title>

  <link
    rel="icon"
    type="image/avif"
    href="../../assets/images/main-logo.avif"
  >

  <link rel="stylesheet" href="../../styles/reset.css">
  <link rel="stylesheet" href="../../styles/root.css">
  <link rel="stylesheet" href="../../styles/header-season.css">
  <link rel="stylesheet" href="../../styles/navigation.css">
  <link rel="stylesheet" href="../../styles/footer.css">
  <link rel="stylesheet" href="../../styles/breadcrumb.css">
  <link rel="stylesheet" href="../../styles/people.css">
</head>

<body
  data-root="../../"
  data-header="header-season"
  data-page="people-troupe"
>
  <div id="common-header"></div>

  <main class="people-page">
    <nav class="breadcrumb" aria-label="Хлебные крошки">
      <div class="breadcrumb__inner">
        <a
          class="breadcrumb__link"
          href="#"
          data-root-path="index.html"
        >
          Главная
        </a>

        <span
          class="breadcrumb__separator"
          aria-hidden="true"
        >
          /
        </span>

        <span class="breadcrumb__current">
          Люди театра
        </span>

        <span
          class="breadcrumb__separator"
          aria-hidden="true"
        >
          /
        </span>

        <span class="breadcrumb__current">
          Труппа
        </span>
      </div>
    </nav>

    <section class="people-header">
      <h1 class="people-header__title">
        АРТИСТЫ
      </h1>
    </section>

    <section
      class="people-alphabet"
      data-people-alphabet
      aria-label="Фильтр артистов по первой букве фамилии"
    ></section>

    <section
      class="people-list"
      data-people-list
    ></section>

    <section
      class="people-guests"
      data-people-guests
    ></section>
  </main>

  <div id="common-footer"></div>

  <script src="../../scripts/layout.js" defer></script>
  <script src="../../scripts/people-data.js" defer></script>
  <script src="../../scripts/people-page.js" defer></script>
</body>
</html>
